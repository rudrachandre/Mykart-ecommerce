version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mykart
      POSTGRES_PASSWORD: mykartpassword
      POSTGRES_DB: mykart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      # Local dev master key only. Override MEILI_MASTER_KEY for anything real.
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-mykart_dev_master_key}
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

volumes:
  postgres_data:
  redis_data:
  meili_data:
